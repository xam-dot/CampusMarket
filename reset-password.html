<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New password - CampusMarket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>CampusMarket</h1>
  </header>

  <div class="auth-box">

    <!-- Shows success or error messages (hidden until needed) -->
    <p id="resetMessage" class="auth-message hidden"></p>

    <form id="resetForm" class="auth-form">
      <h2>Choose a new password</h2>
      <input type="password" id="newPassword" placeholder="New password (8+ characters)" required>
      <input type="password" id="confirmPassword" placeholder="Type it again" required>
      <button type="submit" class="auth-btn">Save password</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // Grab the form and the message box
    const resetForm = document.getElementById("resetForm");
    const resetMessage = document.getElementById("resetMessage");

    // Small helper: show a message (type is "error" or "success")
    function showResetMessage(text, type) {
      resetMessage.textContent = text;
      resetMessage.className = "auth-message " + type;
    }

    resetForm.addEventListener("submit", async function (e) {
      e.preventDefault(); // stops the page from reloading

      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      // Check the length
      if (password.length < 8) {
        showResetMessage("Password must be at least 8 characters.", "error");
        return;
      }

      // Check both boxes match
      if (password !== confirm) {
        showResetMessage("The two passwords do not match.", "error");
        return;
      }

      // The email link already logged them in temporarily,
      // so we can simply update their password.
      const { error } = await db.auth.updateUser({ password: password });

      if (error) {
        showResetMessage(error.message, "error");
        return;
      }

      // Success: tell them, then send them to the marketplace
      showResetMessage("Password changed! Taking you to the marketplace...", "success");
      setTimeout(function () {
        window.location.href = "index.html";
      }, 1500);
    });
  </script>
    <script src="password-toggle.js"></script>
</body>
</html>
