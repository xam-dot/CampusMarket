<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - CampusMarket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 80px 24px;
      color: #1c1e21;
    }
    .icon { font-size: 64px; }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { color: #65676b; line-height: 1.5; }
    button {
      margin-top: 24px;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #ff6a3d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>CampusMarket needs the internet to show listings and stores.<br>Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
