<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit store - CampusMarket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with a link back to the marketplace -->
  <header class="topbar">
    <a href="index.html" class="back-link">← Back</a>
    <h1>Edit store</h1>
  </header>

  <div class="auth-box">

    <!-- Shows success or error messages (hidden until needed) -->
    <p id="editMessage" class="auth-message hidden"></p>

    <!-- The form (hidden until we know the person has a store) -->
    <form id="editForm" class="auth-form" style="display:none">
      <h2>Edit your store</h2>

      <!-- LOGO -->
      <label class="field-label">Store logo</label>
      <img id="logoPreview" class="logo-img" alt="Logo preview" style="display:none">
      <label for="logoInput" class="photo-picker" id="logoPicker">🖼️ Change logo</label>
      <input type="file" id="logoInput" accept="image/*" class="hidden-input">
      <!-- Only shown if the store has a logo -->
      <label class="check-row" id="removeLogoRow" style="display:none">
        <input type="checkbox" id="removeLogo">
        Remove my logo
      </label>

      <!-- STORE NAME -->
      <label class="field-label" for="storeName">Store name</label>
      <input type="text" id="storeName" maxlength="40" required>

      <!-- THE LINK (cannot change, so shared links keep working) -->
      <p class="slug-preview" id="linkNote"></p>

      <!-- DESCRIPTION -->
      <label class="field-label" for="storeDescription">About your store</label>
      <textarea id="storeDescription" rows="4" maxlength="300" placeholder="What do you sell? Where are you based? When are you available?"></textarea>

      <!-- WHATSAPP -->
      <label class="field-label" for="storeWhatsapp">Store WhatsApp number</label>
      <input type="tel" id="storeWhatsapp" placeholder="e.g. 0971234567" required>

      <button type="submit" class="auth-btn" id="saveBtn">Save changes</button>
    </form>

    <!-- Shown if the person has no store yet -->
    <div id="noStore" class="store-done" style="display:none">
      <h2>You don't have a store yet</h2>
      <a class="auth-btn" href="create-store.html">Create my store</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="helpers.js"></script>
  <script src="edit-store.js"></script>
</body>
</html>
