<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings - CampusMarket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="back-link">← Back</a>
    <h1>My Listings</h1>
  </header>

  <!-- Messages (hidden until needed) -->
  <p id="pageMessage" class="auth-message hidden" style="margin:12px 16px"></p>

  <!-- The list of my listings is drawn here by JavaScript -->
  <main id="myList" class="my-list"></main>

  <!-- EDIT POPUP (hidden until Edit is tapped) -->
  <div id="editModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeEdit" class="close-btn">✕</button>

      <form id="editForm" class="auth-form">
        <h2>Edit listing</h2>
        <p class="edit-note">To change photos, delete this listing and post it again.</p>

        <label class="field-label" for="editTitle">Title</label>
        <input type="text" id="editTitle" maxlength="80" required>

        <label class="field-label" for="editCategory">Category</label>
        <select id="editCategory" required>
          <option value="books">Books</option>
          <option value="electronics">Electronics</option>
          <option value="clothes">Clothes</option>
          <option value="beauty">Beauty &amp; Personal Care</option>
          <option value="services">Student Services</option>
          <option value="other">Other</option>
        </select>

        <label class="field-label" for="editPrice">Price in ZMW</label>
        <input type="number" id="editPrice" min="1" step="1" required>

        <label class="field-label" for="editDescription">Description</label>
        <textarea id="editDescription" rows="4" maxlength="500"></textarea>

        <label class="field-label" for="editWhatsapp">WhatsApp number</label>
        <input type="tel" id="editWhatsapp" required>

        <button type="submit" class="auth-btn" id="saveEditBtn">Save changes</button>
      </form>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <nav class="bottom-nav">
    <a href="index.html">🏠<span>Home</span></a>
    <a href="sell.html" class="sell-btn">➕<span>Sell</span></a>
    <a href="my-listings.html" class="active">📋<span>My Listings</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="my-listings.js"></script>
</body>
</html>
