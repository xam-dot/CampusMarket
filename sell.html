<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell - CampusMarket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with a link back to the marketplace -->
  <header class="topbar">
    <a href="index.html" class="back-link">← Back</a>
    <h1>Sell</h1>
  </header>

  <div class="auth-box">

    <!-- Shows success or error messages (hidden until needed) -->
    <p id="sellMessage" class="auth-message hidden"></p>

    <form id="sellForm" class="auth-form">
      <h2>Sell an item or service</h2>

      <!-- PHOTOS -->
      <label class="field-label">Photos (up to 4). The first photo is the cover.</label>
      <!-- This label acts as a big "Add photos" button for the hidden file input -->
      <label for="photoInput" class="photo-picker">📷 Add photos</label>
      <input type="file" id="photoInput" accept="image/*" multiple class="hidden-input">
      <!-- Small previews appear here after choosing photos -->
      <div id="photoPreview" class="photo-preview"></div>

      <!-- TITLE -->
      <label class="field-label" for="title">Title</label>
      <input type="text" id="title" placeholder="e.g. Anatomy textbook, or Barber services" maxlength="80" required>

      <!-- CATEGORY -->
      <label class="field-label" for="category">Category</label>
      <select id="category" required>
        <option value="">Choose a category</option>
        <option value="books">Books</option>
        <option value="electronics">Electronics</option>
        <option value="clothes">Clothes</option>
        <option value="beauty">Beauty &amp; Personal Care</option>
        <option value="services">Student Services</option>
        <option value="other">Other</option>
      </select>

      <!-- PRICE -->
      <label class="field-label" for="price">Price in ZMW (for services, your starting price)</label>
      <input type="number" id="price" placeholder="e.g. 150" min="1" step="1" required>

      <!-- DESCRIPTION -->
      <label class="field-label" for="description">Description (optional)</label>
      <textarea id="description" rows="4" maxlength="500" placeholder="Condition, size, location on campus, what the service includes..."></textarea>

      <!-- WHATSAPP NUMBER (buyers will chat with you here) -->
      <label class="field-label" for="whatsapp">WhatsApp number for buyers</label>
      <input type="tel" id="whatsapp" placeholder="e.g. 0971234567" required>
      <label class="check-row">
        <input type="checkbox" id="saveWhatsapp" checked>
        Save this number so I don't type it again
      </label>

      <button type="submit" class="auth-btn" id="postBtn">Post listing</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="sell.js"></script>
</body>
</html>
